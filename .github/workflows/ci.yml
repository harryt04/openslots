name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BETTER_AUTH_SECRET: ci-secret-min-32-chars-long!!!!!!
  BETTER_AUTH_URL: http://localhost:3000
  MONGO_CONNECTION_STRING: mongodb://localhost:27017

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run ci

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openslots/web exec playwright install --with-deps chromium
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start with docker compose
        env:
          BETTER_AUTH_SECRET: ci-secret-min-32-chars-long!!!!!!
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test the running container
        run: |
          set -eux
          check() { test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1")" = "$2"; }
          curl -fsS http://localhost:3000/api/health
          check /login 200
          check / 307
          # Development-only routes do not exist in the image.
          check /dev/tokens 404
          check /dev/sign-in 404
          check /dev/gallery 404
          # Public pages and API answer without a business.
          check /b/no-such-business 404
          check /api/v1/business 401
          # Indexes were created at start, including the booking lock index.
          docker compose exec -T mongo mongosh --quiet openslots-production \
            --eval 'if (!db.slot_locks.getIndexes().some(i => i.unique && i.key.businessId && i.key.block)) quit(1)'
          # The image runs as a non-root user.
          test "$(docker compose exec -T app id -u)" != "0"
      - name: Fake mode is refused in production
        run: |
          set -eu
          if docker run --rm -e E2E_FAKE_GOOGLE=1 -e MONGO_CONNECTION_STRING=mongodb://x:27017 \
               -e BETTER_AUTH_SECRET=ci-secret-min-32-chars-long!!!!!! -e BETTER_AUTH_URL=http://localhost:3000 \
               openslots:local node -e "import('./apps/web/server.js')" 2>&1 | tee /tmp/fake.log | grep -q "must not be set"; then
            echo "refused as expected"
          else
            echo "::warning::Could not confirm the refusal message from a cold start; see log"; cat /tmp/fake.log | tail -20
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200

